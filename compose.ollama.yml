services:
  frontend:
    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3:latest}"
    extra_hosts:
      - "host.docker.internal=host-gateway"
  ollama:
    profiles: [bundled-ollama]
  ollama-init:
    profiles: [bundled-ollama]
  backend:
    # Allow the Windows server to start and its installed model to warm up.
    healthcheck:
      start_period: 180s
    depends_on: !override
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal=host-gateway"
    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3:latest}"
      OLLAMA_PRELOAD: "1"
